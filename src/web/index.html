<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clinical Trial Retention Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #1f2328;
      --muted: #57606a;
      --accent: #3b82d4;
      --accent-dark: #2563ab;
      --agent-bg: #f0f4ff;
      --agent-border: #c7d7f5;
      --user-bg: #3b82d4;
      --tool-bg: #fafafa;
      --tool-border: #e5e7eb;
      --green: #16a34a;
      --yellow: #ca8a04;
      --red: #dc2626;
      --font: -apple-system, "Segoe UI", system-ui, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    header p  { font-size: 12px; color: var(--muted); }
    .header-right { margin-left: auto; }

    /* ── Participant selector ────────────────────── */
    #setup-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    .setup-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .setup-card p  { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .participant-btn {
      display: block; width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .participant-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,212,0.12);
    }
    .participant-btn .p-name  { font-size: 14px; font-weight: 600; }
    .participant-btn .p-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .participant-btn .p-visit { font-size: 11px; color: var(--accent); margin-top: 4px; font-family: var(--mono); }

    /* ── Chat layout ────────────────────────────── */
    #chat-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    /* participant context bar */
    #context-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      flex-shrink: 0;
    }
    #context-bar strong { font-weight: 600; }
    #context-bar .tag {
      background: var(--agent-bg);
      border: 1px solid var(--agent-border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--accent);
    }
    #switch-btn {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }

    /* message list */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 760px;
    }
    .msg-row.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.agent { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      margin-top: 2px;
    }
    .avatar.agent { background: var(--accent); color: #fff; }
    .avatar.user  { background: #e5e7eb; color: var(--text); }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 560px;
    }
    .msg-row.agent .bubble {
      background: var(--agent-bg);
      border: 1px solid var(--agent-border);
      border-top-left-radius: 4px;
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      color: #fff;
      border-top-right-radius: 4px;
    }

    /* tool execution pills */
    .tool-block {
      align-self: flex-start;
      max-width: 700px;
    }
    .tool-row {
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      border-radius: 8px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .tool-header {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
    }
    .tool-header:hover { background: #f0f1f3; }
    .tool-name {
      font-family: var(--mono);
      font-size: 11px;
      background: #e8f0fe;
      color: #2563ab;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .tool-status { font-size: 11px; color: var(--muted); }
    .tool-chevron { margin-left: auto; color: var(--muted); font-size: 10px; }
    .tool-body {
      display: none;
      padding: 0 12px 10px;
    }
    .tool-body.open { display: block; }
    .tool-body pre {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .tool-label { font-size: 10px; font-weight: 600; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* typing indicator */
    .typing {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 14px;
      background: var(--agent-bg);
      border: 1px solid var(--agent-border);
      border-radius: 12px;
      border-top-left-radius: 4px;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: 0.6;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-5px); }
    }

    /* ── Input bar ──────────────────────────────── */
    #input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #msg-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,212,0.12);
    }
    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-dark); }
    #send-btn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>

<header>
  <div class="logo">CT</div>
  <div>
    <h1>Clinical Trial Retention Agent</h1>
    <p>NYU Stern × IBM watsonx AI Labs</p>
  </div>
</header>

<!-- Participant selection -->
<div id="setup-panel">
  <div class="setup-card">
    <h2>Select a participant</h2>
    <p>Choose who you are chatting as to start a new agent session.</p>
    <div id="participant-list">Loading…</div>
  </div>
</div>

<!-- Chat interface -->
<div id="chat-panel">
  <div id="context-bar">
    <span id="ctx-name"></span>
    <span class="tag" id="ctx-trial"></span>
    <button id="switch-btn">Switch participant</button>
  </div>
  <div id="messages"></div>
  <div id="input-bar">
    <textarea id="msg-input" rows="1" placeholder="Type a message…"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  let sessionId = null;

  // ---------------------------------------------------------------------------
  // Setup — load participants
  // ---------------------------------------------------------------------------
  async function loadParticipants() {
    const list = document.getElementById('participant-list');
    try {
      const res = await fetch('/api/participants');
      const participants = await res.json();
      list.innerHTML = '';
      participants.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'participant-btn';
        const nextVisit = p.upcomingVisits[0];
        const visitLine = nextVisit
          ? `Next visit: ${nextVisit.visitId}  •  ${new Date(nextVisit.scheduledDateTime).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`
          : 'No upcoming visits';
        btn.innerHTML = `
          <div class="p-name">${p.name}</div>
          <div class="p-meta">${p.homeCity}, ${p.homeState}  •  ${p.trialName}</div>
          <div class="p-visit">${visitLine}</div>
        `;
        btn.addEventListener('click', () => startSession(p));
        list.appendChild(btn);
      });
    } catch (e) {
      list.textContent = 'Failed to load participants.';
    }
  }

  // ---------------------------------------------------------------------------
  // Start session
  // ---------------------------------------------------------------------------
  async function startSession(participant) {
    const list = document.getElementById('participant-list');
    const prevHtml = list.innerHTML;
    list.innerHTML = '<div style="color:#57606a;font-size:13px;padding:8px 0">Starting session…</div>';

    try {
      const res = await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ participantId: participant.participantId }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        list.innerHTML = prevHtml;
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'color:#dc2626;font-size:13px;margin-bottom:12px;padding:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px';
        errDiv.textContent = `Error: ${data.error || 'Could not start session'}`;
        list.prepend(errDiv);
        return;
      }

      sessionId = data.sessionId;

      // Update context bar
      document.getElementById('ctx-name').textContent = participant.name;
      document.getElementById('ctx-trial').textContent = participant.trialName;

      // Clear messages and show chat panel
      document.getElementById('messages').innerHTML = '';
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('chat-panel').style.display = 'flex';

      // Welcome message from agent
      appendAgentMessage(
        `Hi ${participant.name.split(' ')[0]}! I'm your clinical trial assistant. I can help you reschedule visits, arrange travel, track reimbursements, or answer questions about your participation in ${participant.trialName}.\n\nWhat can I help you with today?`,
        []
      );

      document.getElementById('msg-input').focus();
    } catch (e) {
      list.innerHTML = prevHtml;
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'color:#dc2626;font-size:13px;margin-bottom:12px;padding:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px';
      errDiv.textContent = 'Could not reach the server. Please try again.';
      list.prepend(errDiv);
    }
  }

  // ---------------------------------------------------------------------------
  // Switch participant
  // ---------------------------------------------------------------------------
  document.getElementById('switch-btn').addEventListener('click', () => {
    sessionId = null;
    document.getElementById('chat-panel').style.display = 'none';
    document.getElementById('setup-panel').style.display = 'flex';
  });

  // ---------------------------------------------------------------------------
  // Send message
  // ---------------------------------------------------------------------------
  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !sessionId) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    appendUserMessage(text);
    const typingEl = appendTyping();

    try {
      const res = await fetch(`/api/session/${sessionId}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      typingEl.remove();
      if (data.error) {
        appendAgentMessage(`⚠️ ${data.error}`, []);
      } else {
        appendAgentMessage(data.response, data.toolExecutions || []);
      }
    } catch {
      typingEl.remove();
      appendAgentMessage('⚠️ Could not reach the server. Is it running?', []);
    }

    document.getElementById('send-btn').disabled = false;
    document.getElementById('msg-input').focus();
  }

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  document.getElementById('msg-input').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });

  // ---------------------------------------------------------------------------
  // Message renderers
  // ---------------------------------------------------------------------------
  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="avatar user">Me</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
  }

  function appendAgentMessage(text, toolExecutions) {
    // Tool executions first (collapsed by default)
    if (toolExecutions && toolExecutions.length > 0) {
      const block = document.createElement('div');
      block.className = 'tool-block';
      toolExecutions.forEach(exec => {
        const row = document.createElement('div');
        row.className = 'tool-row';
        const bodyId = 'tb-' + Math.random().toString(36).slice(2);
        row.innerHTML = `
          <div class="tool-header" onclick="toggleTool('${bodyId}', this)">
            <span class="tool-name">${escHtml(exec.toolName)}</span>
            <span class="tool-status">executed</span>
            <span class="tool-chevron" id="chev-${bodyId}">▶</span>
          </div>
          <div class="tool-body" id="${bodyId}">
            <div class="tool-label">Input</div>
            <pre>${escHtml(JSON.stringify(exec.input, null, 2))}</pre>
            <div class="tool-label" style="margin-top:8px">Output</div>
            <pre>${escHtml(JSON.stringify(exec.output, null, 2))}</pre>
          </div>
        `;
        block.appendChild(row);
      });
      document.getElementById('messages').appendChild(block);
    }

    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="avatar agent">AI</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="avatar agent">AI</div>
      <div class="typing"><span></span><span></span><span></span></div>
    `;
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
    return row;
  }

  function toggleTool(bodyId, header) {
    const body = document.getElementById(bodyId);
    const chev = document.getElementById('chev-' + bodyId);
    const open = body.classList.toggle('open');
    chev.textContent = open ? '▼' : '▶';
  }

  function escHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  loadParticipants();
</script>
</body>
</html>
